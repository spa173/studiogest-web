<!-- BARRA DE NAVEGACIÓN INFERIOR (Solo Móvil - lg:hidden) -->
<nav class="studio-app studio-bottom-nav fixed bottom-0 left-0 w-full z-40 lg:hidden flex justify-around items-center px-2 py-2 bg-primary/95 backdrop-blur-md border-t border-inverse-primary/30 shadow-lg">
  <!-- 1: Inicio -->
  <a href="{% url 'dashboard:index' %}" class="flex flex-col items-center justify-center px-3 py-1 rounded-xl transition-all {% if request.resolver_match.app_name == 'dashboard' %}text-brand-turquoise bg-brand-turquoise/15 font-bold{% else %}text-inverse-primary hover:text-brand-turquoise{% endif %}">
    <span class="material-symbols-outlined text-[22px]" {% if request.resolver_match.app_name == 'dashboard' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>dashboard</span>
    <span class="font-label-xs text-[11px] mt-0.5">Inicio</span>
  </a>

  <!-- 2: Agenda -->
  <a href="{% url 'appointments:calendar' %}" class="flex flex-col items-center justify-center px-3 py-1 rounded-xl transition-all {% if request.resolver_match.app_name == 'appointments' %}text-brand-turquoise bg-brand-turquoise/15 font-bold{% else %}text-inverse-primary hover:text-brand-turquoise{% endif %}">
    <span class="material-symbols-outlined text-[22px]" {% if request.resolver_match.app_name == 'appointments' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>calendar_today</span>
    <span class="font-label-xs text-[11px] mt-0.5">Agenda</span>
  </a>

  <!-- 3: Clientes -->
  <a href="{% url 'customers:list' %}" class="flex flex-col items-center justify-center px-3 py-1 rounded-xl transition-all {% if request.resolver_match.app_name == 'customers' %}text-brand-turquoise bg-brand-turquoise/15 font-bold{% else %}text-inverse-primary hover:text-brand-turquoise{% endif %}">
    <span class="material-symbols-outlined text-[22px]" {% if request.resolver_match.app_name == 'customers' %}style="font-variation-settings: 'FILL' 1;"{% endif %}>groups</span>
    <span class="font-label-xs text-[11px] mt-0.5">Clientes</span>
  </a>

  <!-- 4: Ventas -->
  {% if request.user.is_authenticated %}
  {% if request.user.is_admin or request.user.is_cashier %}
  <a href="{% url 'sales:index' %}" {% if request.resolver_match.app_name == 'sales' %}aria-current="page"{% endif %} class="flex flex-col items-center justify-center px-3 py-1 rounded-xl transition-all {% if request.resolver_match.app_name == 'sales' %}text-brand-turquoise bg-brand-turquoise/15 font-bold{% else %}text-inverse-primary hover:text-brand-turquoise{% endif %}">
    <span class="material-symbols-outlined text-[22px]">point_of_sale</span>
    <span class="font-label-xs text-[11px] mt-0.5">Ventas</span>
  </a>
  {% endif %}
  {% endif %}

  <!-- 5: Perfil / Salir -->
  {% if request.user.is_authenticated %}
  <form action="{% url 'accounts:logout' %}" method="POST" class="inline">
    {% csrf_token %}
    <button type="submit" class="flex flex-col items-center justify-center px-3 py-1 rounded-xl text-inverse-primary hover:text-error transition-all">
      <span class="material-symbols-outlined text-[22px]">logout</span>
      <span class="font-label-xs text-[11px] mt-0.5">Salir</span>
    </button>
  </form>
  {% else %}
  <a href="{% url 'accounts:login' %}" class="flex flex-col items-center justify-center px-3 py-1 rounded-xl text-inverse-primary hover:text-brand-turquoise transition-all">
    <span class="material-symbols-outlined text-[22px]">login</span>
    <span class="font-label-xs text-[11px] mt-0.5">Acceso</span>
  </a>
  {% endif %}
</nav>
