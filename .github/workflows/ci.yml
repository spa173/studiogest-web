name: Django CI

on:
  push:
    branches: [ main, brayan, luisa, luis ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DB_ENGINE: sqlite
      DEBUG: 'False'
      SECRET_KEY: django-insecure-ci-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements-dev.txt

    - name: Configurar Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependencias de Tailwind CSS
      run: npm ci

    - name: Compilar Tailwind CSS
      run: npm run build:css

    - name: Comprobar configuración de pruebas
      run: python manage.py check --settings=config.settings_test

    - name: Ejecutar pruebas automáticas con cobertura
      run: python -m pytest --cov=apps --cov-report=term-missing --cov-report=xml

    - name: Ejecutar pruebas de frontend (Node)
      run: node --test apps/inventory/frontend_test.cjs apps/sales/navigation_test.cjs apps/appointments/pricing_frontend_test.cjs

    - name: Subir reporte de cobertura
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml

    - name: Subir análisis y cobertura a SonarCloud
      if: github.event_name == 'push'
      uses: SonarSource/sonarcloud-github-action@v4
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}