name: Django CI

on:
  push:
    branches: [ main, brayan, luisa, luis ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
      DEBUG: 'True'
      SECRET_KEY: 'ci-secret-key-studiogest-testing'

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Variables de entorno de prueba
      run: |
        cp .env.example .env
        sed -i 's/^DB_ENGINE=.*/DB_ENGINE=sqlite/' .env

    - name: Migraciones de prueba
      run: python manage.py migrate

    - name: Ejecutar pruebas automáticas
      run: |
        python manage.py check
        python manage.py test accounts customers services appointments dashboard reports inventory sales
